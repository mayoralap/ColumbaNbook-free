    <script src="https://cdn.datatables.net/2.2.1/js/dataTables.bootstrap5.min.js"></script>

    <script>
        const PARENTS_HEADERS = [
            "Id", "Ejemplar", "Sexo", "Anilla", "Existe", "Activo", "Estado", "Año", "Ejemplares"
        ];

        let miTablaDataTable = null;
        let idToDelete = null;

        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("ColumbaDB", 1);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains("Parents")) {
                        db.createObjectStore("Parents", { keyPath: "Id", autoIncrement: true });
                    }
                };
                request.onsuccess = (event) => resolve(event.target.result);
                request.onerror = (event) => reject(event.target.error);
            });
        }

        async function getDataParent() {
            const db = await initIndexedDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("Parents", "readonly");
                const store = tx.objectStore("Parents");
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function agregarPadreIndexedDB(datosPadre) {
            const db = await initIndexedDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("Parents", "readwrite");
                const store = tx.objectStore("Parents");
                datosPadre.Id = Date.now();
                datosPadre.Ejemplares = generarCampoEjemplares(datosPadre);
                const request = store.add(datosPadre);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function actualizarPadreIndexedDB(datosPadre) {
            const db = await initIndexedDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("Parents", "readwrite");
                const store = tx.objectStore("Parents");
                datosPadre.Id = parseInt(datosPadre.Id, 10);
                datosPadre.Ejemplares = generarCampoEjemplares(datosPadre);
                const request = store.put(datosPadre);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function eliminarFilaPorIDIndexedDB(id) {
            const db = await initIndexedDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("Parents", "readwrite");
                const store = tx.objectStore("Parents");
                const numericId = parseInt(id, 10);
                const request = store.delete(numericId);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function generarCampoEjemplares(datos) {
            let resultado = datos.Ejemplar;
            if (datos.Anilla && datos.Anilla.trim() !== "") resultado += " {" + datos.Anilla.trim() + "}";
            if (datos.Año && datos.Año.trim() !== "") resultado += " - " + datos.Año.trim();
            return resultado;
        }

        function calculateAgeFromBirthYear(birthYearString) {
            const currentYear = new Date().getFullYear();
            const parsedYear = parseInt(birthYearString, 10);
            if (!birthYearString || isNaN(parsedYear)) return " Desconocida";
            if (parsedYear < 1900 || parsedYear > currentYear) return "Año inválido";
            const difference = currentYear - parsedYear;
            if (difference <= 0) return " Menor de 1 Año";
            if (difference === 1) return " 1 Año Aproximado";
            if (difference > 18) return " Excede el promedio de vida (>18 años)";
            return `${difference} Años Aproximados`;
        }

        function calcularEdad(yearEncontrado) {
            const añoActual = new Date().getFullYear();
            if (!yearEncontrado || isNaN(yearEncontrado)) return " Desconocida";
            let diferencia = añoActual - parseInt(yearEncontrado);
            let textoAños = diferencia === 1 ? " Año Aproximado" : " Años Aproximados";
            return diferencia <= 0 ? " Menor de 1 Año" : diferencia + textoAños;
        }

        async function renderizarTabla() {
            try {
                const registros = await getDataParent();
                const dataParaTabla = registros.map(row => {
                    const id = row.Id;
                    const actionButtons = `
                        <div class="d-flex justify-content-center flex-wrap" data-id="${id}" style="gap: 4px;">
                        <button class="btn btn-outline-info btn-sm btn-Edit btn-sm-custom" title="Editar ejemplar" onclick="editPadreModal(this)">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                        <button class="btn btn-outline-danger btn-sm btn-delete btn-sm-custom" title="Eliminar ejemplar definitivo" onclick="eliminarModalPadre(${id})">
                            <i class="bi bi-trash"></i>
                        </button>
                        <button class="btn btn-outline-success btn-sm btn-sm-custom" title="Generar Informe PDF" onclick="exportarInfo_ejePDF('${id}')">
                            <i class="fas fa-file-export"></i>
                        </button>
                        </div>`;
                    
                    return [
                        row.Id, row.Ejemplar, row.Sexo, row.Anilla || '', 
                        row.Existe, row.Activo, row.Estado, row.Año || '', 
                        row.Ejemplares || '', actionButtons
                    ];
                });

                if (miTablaDataTable !== null) {
                    miTablaDataTable.clear();
                    miTablaDataTable.rows.add(dataParaTabla);
                    miTablaDataTable.draw();
                } else {
                    const columnasFormateadas = PARENTS_HEADERS.map(header => ({ 'title': header }));
                    columnasFormateadas.push({ 'title': 'Acciones', 'orderable': false, 'className': 'columna-acciones' });

                    miTablaDataTable = $('#tablaPadres').DataTable({
                        data: dataParaTabla,
                        columns: columnasFormateadas,
                        language: {
                            "processing": "Procesando...",
                            "lengthMenu": "Mostrar _MENU_ registros",
                            "zeroRecords": "No se encontraron resultados",
                            "emptyTable": "Ningún dato disponible en esta tabla",
                            "info": "Mostrando del _START_ al _END_ de _TOTAL_ registros",
                            "infoEmpty": "Mostrando registros del 0 al 0 de un total de 0",
                            "infoFiltered": "(filtrado de un total de _MAX_ registros)",
                            "search": "Buscar:",
                            "loadingRecords": "Cargando...",
                            "paginate": {
                                "first": "Primero",
                                "last": "Último",
                                "next": "Siguiente",
                                "previous": "Anterior"
                            }
                        },
                        order: [[0, 'asc'], [1, 'desc'], [7, 'asc']],
                        columnDefs: [
                            { targets: [0, 8], visible: false }, // Ocultar columna Id y Columna Ejemplares
                            { targets: [2, 3, 4, 5, 7], className: "dt-center" } 
                        ],
                        lengthMenu: [12, 25, 35, 50, 100],
                        responsive: true
                    });
                }
            } catch (error) {
                console.error("Error al renderizar la tabla:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderizarTabla();
            inicializarModal('createModal');
        });

        function guardarDatos() {
            const form = document.getElementById('crearPadres');
            const mode = form.dataset.mode;
            const id = form.idPadre.value;
            const loadingMessage = document.getElementById('loadingMessage');
            const btnGuardar = document.getElementById('btnGuardar');
            const btnCerrar = document.getElementById('btnCerrar');

            btnGuardar.disabled = true;
            btnCerrar.disabled = true;

            let ejemplar = form.ejemplar.value.trim().replace(/\s+/g, ' ');
            form.ejemplar.value = ejemplar;

            if (!ejemplar) {
                loadingMessage.innerText = 'El campo Ejemplar es obligatorio.';
                loadingMessage.style.display = 'block';
                setTimeout(() => { loadingMessage.style.display = 'none'; btnGuardar.disabled = false; btnCerrar.disabled = false; }, 3000);
                return;
            }

            const datosPadre = {
                Ejemplar: form.ejemplar.value,
                Sexo: form.sexo.value,
                Anilla: form.anilla.value,
                Existe: form.existe.checked ? "Sí" : "No",
                Activo: form.activo.checked ? "Sí" : "No",
                Estado: form.estado.value,
                Año: form.years.value
            };

            if (mode === 'update') {
                datosPadre.Id = parseInt(id, 10);
            }

            const onSuccess = () => {
                form.reset();
                form.dataset.mode = 'create';
                form.idPadre.value = '';
                bootstrap.Modal.getInstance(document.getElementById('createModal')).hide();
                renderizarTabla(); 
                loadingMessage.style.display = 'none';
                btnGuardar.disabled = false;
                btnCerrar.disabled = false;
            };

            const onFailure = (err) => {
                console.error("Error al guardar:", err);
                loadingMessage.innerText = 'Error al guardar datos.';
                setTimeout(() => { loadingMessage.style.display = 'none'; btnGuardar.disabled = false; btnCerrar.disabled = false; }, 3000);
            };

            if (mode === 'create') {
                agregarPadreIndexedDB(datosPadre).then(onSuccess).catch(onFailure);
            } else if (mode === 'update') {
                actualizarPadreIndexedDB(datosPadre).then(onSuccess).catch(onFailure);
            }
        }

        function editPadreModal(btn) {
            if (!miTablaDataTable) return;
            let tableRow = $(btn).closest('tr');
            if (tableRow.hasClass('child')) {
                tableRow = tableRow.prev('.parent');
            }
            const rowData = miTablaDataTable.row(tableRow).data();
            if (!rowData) return;

            const id = rowData[0];
            const ejemplar = rowData[1];
            const sexo = rowData[2];
            const anilla = rowData[3];
            const existe = String(rowData[4]).toLowerCase() === 'sí';
            const activo = String(rowData[5]).toLowerCase() === 'sí';
            const estado = rowData[6];
            const year = rowData[7];
            const edadCalculada = calcularEdad(year);

            document.getElementById('modalTitle').textContent = 'Actualizar Ejemplar';
            const form = document.getElementById('crearPadres');
            form.dataset.mode = 'update'; 

            document.getElementById('idPadre').value = id;
            document.getElementById('ejemplar').value = ejemplar;
            document.getElementById('sexo').value = sexo;
            document.getElementById('anilla').value = anilla;
            document.getElementById('existe').checked = existe;
            document.getElementById('activo').checked = activo;
            document.getElementById('estado').value = estado;
            document.getElementById('years').value = year;
            document.getElementById('edadCalculada').value = edadCalculada; 

            bootstrap.Modal.getOrCreateInstance('#createModal').show();
        }

        const estadosNoExiste = ['Capturado', 'Desconocido', 'Devueltas', 'Negocio', 'Entregada', 'Enfermedades', 'Muerte', 'Depredadores', 'No Nacidos', 'En Proceso', 'Ventas', 'Otras'];
        const estadosSiExiste = ['Al Robo', 'Descanso', 'Entrenamiento', 'Recuperado', 'Adquiridas', 'Reproducción', 'Préstamos'];

        function actualizarEstadoCheckboxExiste(modalElement) {
            const selectEstado = modalElement.querySelector('#estado');
            const checkboxExiste = modalElement.querySelector('#existe');
            if (!selectEstado || !checkboxExiste) return;

            const estado = selectEstado.value;
            if (estadosNoExiste.includes(estado)) {
                checkboxExiste.checked = false; checkboxExiste.disabled = true;
            } else if (estadosSiExiste.includes(estado)) {
                checkboxExiste.checked = true; checkboxExiste.disabled = true;
            } else {
                checkboxExiste.disabled = false;
            }
            handleYearOrExistsChange({ target: checkboxExiste });
        }

        function handleYearOrExistsChange(event) {
            const modal = event.target.closest('.modal');
            if (!modal) return;
            const yearInput = modal.querySelector('#years');
            const edadField = modal.querySelector('#edadCalculada');
            const checkboxExiste = modal.querySelector('#existe');

            if (!yearInput || !edadField || !checkboxExiste) return;
            const yearValue = yearInput.value.trim();
            const existe = checkboxExiste.checked;

            if (!existe || yearValue === '') {
                edadField.value = " Desconocida";
                return;
            }
            edadField.value = /^\d{4}$/.test(yearValue) ? calculateAgeFromBirthYear(yearValue) : "Formato AAAA";
        }

        function inicializarModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            const selectEstado = modal.querySelector('#estado');
            const yearInput = modal.querySelector('#years');
            const checkboxExiste = modal.querySelector('#existe');

            if (selectEstado) selectEstado.addEventListener('change', () => actualizarEstadoCheckboxExiste(modal));
            if (yearInput) yearInput.addEventListener('input', handleYearOrExistsChange);
            if (checkboxExiste) {
                checkboxExiste.addEventListener('change', handleYearOrExistsChange);
                checkboxExiste.addEventListener('click', (e) => { if (checkboxExiste.disabled) e.preventDefault(); });
            }
        }

        function abrirModalCrear(modo) {
            const form = document.getElementById('crearPadres');
            form.reset();
            form.dataset.mode = modo;
            form.idPadre.value = '';
            document.getElementById('modalTitle').textContent = 'Nuevo Ejemplar';
            bootstrap.Modal.getOrCreateInstance('#createModal').show();
            setTimeout(() => {
                document.getElementById('estado').dispatchEvent(new Event('change'));
            }, 100);
        }

        function eliminarModalPadre(idRow) {
            if (!idRow) return;
            idToDelete = idRow;
            bootstrap.Modal.getOrCreateInstance('#confirmDeleteModal').show();
        }

        document.getElementById('confirmDeleteButton').addEventListener('click', () => {
            const btn = document.getElementById('confirmDeleteButton');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Eliminando...';

            eliminarFilaPorIDIndexedDB(idToDelete).then(() => {
                renderizarTabla();
                bootstrap.Modal.getInstance(document.getElementById('confirmDeleteModal')).hide();
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-trash-fill"></i> Eliminar';
            }).catch(() => {
                console.error('Error al eliminar el registro.');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-trash-fill"></i> Eliminar';
            });
        });

        async function exportarInfo_ejePDF(idString) {
          const btn = event.currentTarget || document.querySelector(`button[onclick="exportarInfo_ejePDF('${idString}')"]`);
          let originalIcon = '<i class="fas fa-file-export"></i>';
          if (btn) {
              originalIcon = btn.innerHTML;
              btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>';
              btn.disabled = true;
          }

          try {
              const id = parseInt(idString, 10);
              const db = await initIndexedDB();
              const tx = db.transaction("Parents", "readonly");
              const store = tx.objectStore("Parents");
              const request = store.get(id);

              request.onsuccess = function() {
                  const data = request.result;
                  if (!data) {
                      console.error("No se encontró el ejemplar en la base de datos.");
                      if(btn) { btn.innerHTML = originalIcon; btn.disabled = false; }
                      return;
                  }

                  const { jsPDF } = window.jspdf;
                  const doc = new jsPDF();

                  let headerY = 20;

                  // Título
                  doc.setFont("helvetica", "bold");
                  doc.setFontSize(22);
                  doc.setTextColor(26, 35, 126);
                  doc.text("Ejemplares", 105, headerY, null, null, "center");

                  // Subtítulo
                  doc.setFontSize(11);
                  doc.setTextColor(27, 94, 32);
                  doc.text("Columba Notebook-free", 105, headerY + 8, null, null, "center");

                  doc.setDrawColor(200, 200, 200);
                  doc.setLineWidth(0.5);
                  doc.line(20, headerY + 14, 190, headerY + 14);

                  let startY = headerY + 24;
                  const cardBgColor = [224, 235, 235];
                  const labelColor = [26, 35, 126];
                  const textColor = [27, 94, 32];

                  function dibujarCampoFormulario(label, valor, x, y, w, h, esCheckbox = false, marcado = false, align = 'center') {
                      doc.setFont("helvetica", "bold");
                      doc.setFontSize(11);
                      doc.setTextColor(labelColor[0], labelColor[1], labelColor[2]);
                      doc.text(label, x, y);

                      doc.setFillColor(cardBgColor[0], cardBgColor[1], cardBgColor[2]);
                      doc.roundedRect(x, y + 3, w, h, 2, 2, 'F');

                      if (esCheckbox) {
                          const boxSize = 6;
                          const bx = x + (w / 2) - (boxSize / 2);
                          const by = y + 3 + (h / 2) - (boxSize / 2);
                          doc.setDrawColor(100, 100, 100);
                          doc.setFillColor(255, 255, 255);
                          doc.roundedRect(bx, by, boxSize, boxSize, 1, 1, 'FD');

                          if (marcado) {
                              doc.setFont("helvetica", "bold");
                              doc.setFontSize(12);
                              doc.setTextColor(27, 94, 32);
                              doc.text("X", bx + (boxSize / 2), by + (boxSize / 2) + 1.5, null, null, "center");
                          }
                      } else {
                          doc.setFont("helvetica", "bold");
                          doc.setFontSize(12);
                          doc.setTextColor(textColor[0], textColor[1], textColor[2]);
                          if (align === 'left') {
                              doc.text(String(valor || "N/A"), x + 6, y + 3 + (h / 2) + 2);
                          } else {
                              doc.text(String(valor || "N/A"), x + (w / 2), y + 3 + (h / 2) + 2, null, null, "center");
                          }
                      }
                  }

                  dibujarCampoFormulario("Ejemplar", data.Ejemplar || "No Información", 20, startY, 170, 14, false, false, 'left');
                  startY += 24;

                  const colWidth = 52;
                  const colGap = 7;
                  let currentX = 20;

                  dibujarCampoFormulario("Sexo", data.Sexo === 'M' ? 'Macho' : (data.Sexo === 'H' ? 'Hembra' : 'N/A'), currentX, startY, colWidth, 14);
                  currentX += colWidth + colGap;

                  dibujarCampoFormulario("Anilla", data.Anilla || "N/A", currentX, startY, colWidth, 14);
                  currentX += colWidth + colGap;

                  dibujarCampoFormulario("Año", data.Año || "N/A", currentX, startY, colWidth, 14);
                  startY += 24;

                  currentX = 20;
                  const existeBool = String(data.Existe).toLowerCase() === 'sí' || data.Existe === true;
                  dibujarCampoFormulario("Existe", "", currentX, startY, colWidth, 14, true, existeBool);
                  currentX += colWidth + colGap;

                  const activoBool = String(data.Activo).toLowerCase() === 'sí' || data.Activo === true;
                  dibujarCampoFormulario("Activo", "", currentX, startY, colWidth, 14, true, activoBool);
                  currentX += colWidth + colGap;

                  dibujarCampoFormulario("Estado", data.Estado || "N/A", currentX, startY, colWidth, 14);
                  startY += 24;

                  const edadTexto = calcularEdad(data.Año);
                  //dibujarCampoFormulario("Edad", edadTexto, 20, startY, 170, 14);
                  dibujarCampoFormulario("Edad", edadTexto, 20, startY, 170, 14, false, false, 'left');
                  startY += 30;

                  doc.setFont("helvetica", "italic");
                  doc.setFontSize(10);
                  doc.setTextColor(150, 150, 150);
                  const fechaFormateada = new Date().toLocaleDateString('es-ES');
                  doc.text(`Generado el ${fechaFormateada} - Columba Notebook-free`, 105, 285, null, null, "center");

                  const nombreArchivoPDF = (data.Ejemplares || data.Ejemplar || 'Ejemplar') + '.pdf';
                  doc.save(nombreArchivoPDF);

                  if(btn) { btn.innerHTML = originalIcon; btn.disabled = false; }
              };

              request.onerror = function() {
                  console.error("Error al leer la base de datos local para el PDF.");
                  if(btn) { btn.innerHTML = originalIcon; btn.disabled = false; }
              };
          } catch (error) {
              console.error("Error generando PDF:", error);
              if(btn) { btn.innerHTML = originalIcon; btn.disabled = false; }
          }
      }



    </script>
